name: Build Windows Exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install edge-tts pydub static-ffmpeg pyinstaller

    - name: Compile to EXE
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "KhmerDubbingTool" --collect-all static_ffmpeg app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KhmerDubbingTool-Windows
        path: dist/KhmerDubbingTool/
